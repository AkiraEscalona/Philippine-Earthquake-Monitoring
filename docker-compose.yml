# Kafka (KRaft, single broker) + MongoDB + Spark Structured Streaming job.
# Streamlit and the producer run natively on Windows (see README).
name: philippine-earthquakes

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: eq-kafka
    ports:
      - "127.0.0.1:29092:29092"   # host listener used by producer.py
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: eq-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ${KAFKA_TOPIC:-philippine-earthquakes} --partitions 1 --replication-factor 1
        --config retention.ms=604800000

  mongo:
    image: mongo:7
    container_name: eq-mongo
    ports:
      - "127.0.0.1:27017:27017"   # no auth: bound to localhost only. Add credentials before exposing.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  spark:
    # Spark 3.5.3 / Scala 2.12 / Java 17 / Python 3 - matches the connector artifacts below.
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: eq-spark
    user: root                      # named volumes are root-owned; fine for local development
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    restart: on-failure
    environment:
      SPARK_KAFKA_BOOTSTRAP: kafka:9092
      SPARK_MONGO_URI: mongodb://mongo:27017
      KAFKA_TOPIC: ${KAFKA_TOPIC:-philippine-earthquakes}
      MONGO_DB: ${MONGO_DB:-earthquake_monitor}
    volumes:
      - ./spark:/opt/app:ro
      - spark_checkpoints:/opt/checkpoints
      - spark_ivy:/tmp/ivy
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.mongodb.spark:mongo-spark-connector_2.12:10.4.0
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --conf
      - spark.sql.shuffle.partitions=4
      - /opt/app/streaming_job.py

volumes:
  kafka_data:
  mongo_data:
  spark_checkpoints:
  spark_ivy:
